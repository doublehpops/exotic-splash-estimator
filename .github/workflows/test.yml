name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the test suite
        # `node tools/*.test.js` runs only the first file. This runner starts
        # each tools/*.test.js and exits non-zero if any file fails.
        run: node tools/run-tests.js
